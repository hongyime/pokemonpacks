name: Build Check

# COST-OPTIMISED (2026-07-04):
# - concurrency: cancel-in-progress so a new commit cancels the previous PR build.
# - Existing paths filter kept (already skips markdown-only edits).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lockb'
      - '*.config.*'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      # Only run when JS/TS source or dependency files change
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.vue"
      - "**.css"
      - "**.scss"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "bun.lockb"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "vite.config.*"
      - "tsconfig*.json"
      - "tests/**"
      - "public/**"
      - "index.html"
      - ".github/workflows/ci.yml"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Node.js project
        id: detect
        run: |
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
            # Detect package manager
            if [ -f "bun.lockb" ]; then
              echo "pm=bun" >> "$GITHUB_OUTPUT"
            elif [ -f "pnpm-lock.yaml" ]; then
              echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            else
              echo "pm=npm" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            echo "No build script found in package.json — skipping build check."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: ${{ steps.detect.outputs.pm != 'bun' && steps.detect.outputs.pm || '' }}

      - name: Install dependencies (npm)
        if: steps.detect.outputs.has_build == 'true' && steps.detect.outputs.pm == 'npm'
        # Use --legacy-peer-deps as a last resort only — if install fails cleanly
        # first, that failure is intentional and should block the PR.
        run: npm ci

      - name: Install dependencies (pnpm)
        if: steps.detect.outputs.has_build == 'true' && steps.detect.outputs.pm == 'pnpm'
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Install dependencies (bun)
        if: steps.detect.outputs.has_build == 'true' && steps.detect.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install frozen Bun dependencies
        if: steps.detect.outputs.has_build == 'true' && steps.detect.outputs.pm == 'bun'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Storage regressions
        run: node --test tests/*.test.mjs

      - name: Run build
        if: steps.detect.outputs.has_build == 'true'
        run: ${{ steps.detect.outputs.pm == 'npm' && 'npm run build' || format('{0} run build', steps.detect.outputs.pm) }}

      - name: Set up browser verification
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: Verify storage and API flows without external providers
        run: python tests/browser.py

      - name: Preserve reviewed build and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-packs-build
          path: |
            dist/
            browser-results/
          retention-days: 3
          if-no-files-found: error

      - name: Build succeeded
        if: steps.detect.outputs.has_build == 'true'
        run: echo "✅ Build passed — safe to merge."

      - name: No build script
        if: steps.detect.outputs.has_build == 'false'
        run: echo "ℹ️ No build script detected — skipping build check."
